<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- Inner subtle border -->
  <rect x="22" y="22" width="212" height="212" rx="42" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Shield Shape with Glow -->
  <g filter="url(#shadow)">
    <!-- Shield Base -->
    <path d="M 128 50
             C 170 50, 195 56, 195 56
             C 195 125, 175 180, 128 206
             C 81 180, 61 125, 61 56
             C 61 56, 86 50, 128 50 Z"
          fill="#1e293b"
          stroke="url(#shieldGrad)"
          stroke-width="8"
          stroke-linejoin="round" />
    
    <!-- Shield Inner Fill Accent -->
    <path d="M 128 62
             C 162 62, 183 67, 183 67
             C 183 122, 167 169, 128 192
             C 89 169, 73 122, 73 67
             C 73 67, 94 62, 128 62 Z"
          fill="#0f172a"
          fill-opacity="0.8" />
  </g>

  <!-- Checkmark / Pulse Security Symbol -->
  <path d="M 102 128 L 120 146 L 158 106"
        fill="none"
        stroke="#34d399"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Traffic Light Accent Dot (Upper Right) -->
  <circle cx="196" cy="60" r="14" fill="#10b981" stroke="#020617" stroke-width="4" />
  <circle cx="196" cy="60" r="7" fill="#6ee7b7" />
</svg>