[package]
name = "taskguard-desktop"
version = "0.1.0"
description = "TaskGuard Desktop - Priorizador Eisenhower con Seguridad Médica HIPAA"
authors = ["TaskGuard Team"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "notification-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
